x}.playpill svg{width:18px;height:18px}.gifwrap::before,.gifwrap::after{inset:-8px;border-radius:10px}}\n@media(prefers-reduced-motion:reduce){.gifwrap::before,.gifwrap::after,.hint5 .hand{animation:none}.gifwrap::before{opacity:.5}}\n<\/style><\/head><body>\n\n<section class=\"slide cover\">\n<div class=\"eyebrow\">Desarrollo de marca e identidad visual<\/div>\n<h1>Sistemas Visuales y Proyectos de Diseño Gráfico<\/h1>\n<p class=\"lead\">Exploración conceptual, geometría clásica y paletas cromáticas para Lamberti Dental y Abogados Complutum.<\/p>\n<div class=\"tag\">DISEÑO DE IDENTIDAD CORPORATIVA · LAMBERTI &amp; COMPLUTUM<\/div>\n<div class=\"foot\"><span>Desarrollo de Marca e Identidad Visual<\/span><span>Portafolio 2026 · Página 1 de 6<\/span><\/div>\n<\/section>\n\n<section class=\"slide\">\n<div class=\"eyebrow\">01 / Lamberti Dental<\/div><h2>Análisis de Forma, Geometría y Color<\/h2>\n<div class=\"body\"><div class=\"card logo\"><img src=\"img/lamberti_logo.png\" alt=\"Logotipo de Lamberti Dental: molar fusionado con una columna jónica, en azul marino\"><\/div>\n<div class=\"col\"><div class=\"card\"><h3>Síntesis Arquitectónica y Forma<\/h3><p>Fusión formal entre la anatomía dental y la columna jónica clásica, transmitiendo solidez, salud y un rigor profesional elevado.<\/p><\/div>\n<div class=\"card\"><h3>Paleta Cromática y Tipografía<\/h3><p>Azul marino clínico profundo sobre soportes limpios que aporta confianza, higiene y atemporalidad a la identidad.<\/p><\/div><\/div><\/div>\n<div class=\"foot\"><span>Lamberti Dental<\/span><span>Página 2 de 6<\/span><\/div><\/section>\n\n<section class=\"slide\">\n<div class=\"eyebrow\">02 / Abogados Complutum<\/div><h2>Simbología, Jano y Estilo Sofisticado<\/h2>\n<div class=\"body\"><div class=\"card logo\"><img src=\"img/complutum_emblema.png\" alt=\"Emblema de Abogados Complutum: Jano bifronte entrelazado con la letra A, en oro\"><\/div>\n<div class=\"col\"><div class=\"card\"><h3>Concepto de Jano Bifronte<\/h3><p>Representación dual que simboliza la visión estratégica hacia el pasado y el futuro, entrelazada con la inicial central 'A'.<\/p><\/div>\n<div class=\"card\"><h3>Gama Cromática Dual<\/h3><p>Variantes en Oro Noble e Identidad Oscura que refuerzan el prestigio, la seriedad y el carácter formal del despacho legal.<\/p><\/div><\/div><\/div>\n<div class=\"foot\"><span>Abogados Complutum<\/span><span>Página 3 de 6<\/span><\/div><\/section>\n\n<section class=\"slide\">\n<div class=\"eyebrow\">Variaciones corporativas<\/div><h2>Versiones de Logotipo y Tipografía<\/h2>\n<div class=\"pair\"><div class=\"card\"><img class=\"w\" src=\"img/complutum_logo_dorado.png\" alt=\"Logotipo Abogados Complutum, versión dorada\"><div class=\"cap\">Versión Corporativa Dorada<\/div><\/div>\n<div class=\"card\"><img class=\"w\" src=\"img/complutum_logo_oscuro.png\" alt=\"Logotipo Abogados Complutum, versión oscura\"><div class=\"cap\">Versión Corporativa Oscura<\/div><\/div><\/div>\n<div class=\"foot\"><span>Variaciones Tipográficas<\/span><span>Página 4 de 6<\/span><\/div><\/section>\n\n<section class=\"slide\">\n<div class=\"eyebrow\">Aplicaciones y mockups<\/div><h2>Fotomontajes de Marca y Soportes<\/h2>\n<div class=\"pair\"><div class=\"card\"><span class=\"gifwrap\"><img class=\"s gifbtn\" src=\"img/lamberti_logo.png\" alt=\"Lamberti Dental aplicado a señalética\" data-gif=\"img/identidad_lamberti_dental.gif\" data-title=\"Identidad integral · Lamberti Dental\" role=\"button\" tabindex=\"0\" title=\"Clic para ver el fotomontaje animado\"><\/span><h3>Señalética &amp; Entorno Clínico<\/h3><p>Aplicación sobre soportes limpios y luminosos.<\/p><span class=\"playpill\" data-gif=\"img/identidad_lamberti_dental.gif\" data-title=\"Identidad integral · Lamberti Dental\" role=\"button\" tabindex=\"0\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M10 8l6 4-6 4z\" fill=\"currentColor\"/><\/svg>Ver fotomontaje animado<\/span><\/div>\n<div class=\"card\"><span class=\"gifwrap\"><img class=\"s gifbtn\" src=\"img/complutum_emblema_papeleria.png\" alt=\"Emblema de Complutum para papelería\" data-gif=\"img/identidad_abogados_complutum.gif\" data-title=\"Identidad integral · Abogados Complutum\" role=\"button\" tabindex=\"0\" title=\"Clic para ver el fotomontaje animado\"><\/span><h3>Papelería Legal &amp; Grabados<\/h3><p>Estampaciones y soportes de alta gramatura.<\/p><span class=\"playpill\" data-gif=\"img/identidad_abogados_complutum.gif\" data-title=\"Identidad integral · Abogados Complutum\" role=\"button\" tabindex=\"0\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"11\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><path d=\"M10 8l6 4-6 4z\" fill=\"currentColor\"/><\/svg>Ver fotomontaje animado<\/span><\/div><\/div>\n<div class=\"hint5\"><svg class=\"hand\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M9 11V5.5a1.5 1.5 0 013 0V10h.5V8.5a1.5 1.5 0 013 0V10h.5V9.5a1.5 1.5 0 013 0V15a6 6 0 01-6 6h-1.2a6 6 0 01-4.7-2.3L4.6 15.3a1.5 1.5 0 012.2-2L9 15z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.4\" stroke-linejoin=\"round\"/><\/svg><span>Haz clic en cada logotipo para descubrir su fotomontaje<\/span><\/div>\n<div class=\"foot\"><span>Fotomontajes y Mockups<\/span><span>Página 5 de 6<\/span><\/div><\/section>\n\n<section class=\"slide end\">\n<div class=\"eyebrow\">Conclusión del proyecto · Identidad visual<\/div>\n<h1>Marcas con Alma Clásica y Visión Contemporánea<\/h1>\n<p>El diseño gráfico desarrollado equilibra la tradición clásica y la vanguardia funcional para consolidar la presencia de ambas instituciones en el mercado.<\/p>\n<div class=\"thanks\">GRACIAS POR SU ATENCIÓN<\/div>\n<div class=\"foot\"><span>Conclusión<\/span><span>Página 6 de 6<\/span><\/div><\/section>\n\n<div id=\"gifOverlay\" aria-modal=\"true\" role=\"dialog\"><h4 id=\"gifTitle\"><\/h4><button id=\"gifClose\" type=\"button\">✕  Cerrar<\/button><div class=\"load\" id=\"gifLoad\">Cargando animación…<\/div><img id=\"gifImg\" alt=\"\" hidden><\/div>\n<script>\n(function(){\n  var ov=document.getElementById('gifOverlay'),img=document.getElementById('gifImg'),\n      ttl=document.getElementById('gifTitle'),ld=document.getElementById('gifLoad');\n  function open(el){\n    ttl.textContent=el.getAttribute('data-title')||'';\n    img.alt=el.getAttribute('data-title')||'';\n    img.hidden=true; ld.style.display='block';\n    img.onload=function(){ld.style.display='none';img.hidden=false;};\n    img.onerror=function(){ld.textContent='No se encontró el GIF ('+el.getAttribute('data-gif')+'). Comprueba que está en la carpeta img/.';};\n    img.src=el.getAttribute('data-gif');\n    ov.classList.add('on');\n  }\n  function close(){ov.classList.remove('on');img.removeAttribute('src');img.hidden=true;ld.textContent='Cargando animación…';}\n  document.querySelectorAll('[data-gif]').forEach(function(el){\n    el.addEventListener('click',function(){open(el);});\n    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open(el);}});\n  });\n  document.getElementById('gifClose').addEventListener('click',close);\n  ov.addEventListener('click',function(e){if(e.target===ov)close();});\n  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ov.classList.contains('on')){e.stopPropagation();close();}});\n})();\n<\/script>\n<\/body><\/html>"</script>

    const phi = Math.acos(Math.random() * 0.9); // sesgado hacia el cenit, evita el horizonte bajo
    const r = radius * (0.85 + Math.random() * 0.15);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = Math.abs(r * Math.cos(phi)) + 6;
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    sizes[i] = 0.8 + Math.random() * 1.6;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    size: 1.6,
    map: starTex,
    transparent: true,
    depthWrite: false,
    fog: false,
    color: 0xffffff,
    sizeAttenuation: true
  });
  const stars = new THREE.Points(geo, mat);
  scene.add(stars);
}
addStars(900);

function toScene(fx, fy, fw, fh) {
  return {
    X: (fx + fw / 2 - MAP_W / 2) / SCALE,
    Z: (fy + fh / 2 - MAP_H / 2) / SCALE,
    W: fw / SCALE,
    D: fh / SCALE
  };
}

function makeRoofMaterial(baseTexture, W, D) {
  const tex = baseTexture.clone();
  tex.image = baseTexture.image;
  tex.needsUpdate = true;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1, Math.round(W * 1.6)), Math.max(1, Math.round(D * 1.6)));
  if (renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, metalness: 0.0 });
}

function addBuilding(fx, fy, fw, fh, height, roofTexture, facadeDataURI) {
  const s = toScene(fx, fy, fw, fh);
  const geo = new THREE.BoxGeometry(s.W, height, s.D);
  let mat;
  if (roofTexture || facadeDataURI) {
    const roofMat = roofTexture ? makeRoofMaterial(roofTexture, s.W, s.D) : buildingMaterial;
    mat = [buildingMaterial, buildingMaterial, roofMat, buildingMaterial, buildingMaterial, buildingMaterial];
  } else {
    mat = buildingMaterial;
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(s.X, height / 2, s.Z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  if (!facadeDataURI) {
    const edges = new THREE.EdgesGeometry(geo);
    mesh.add(new THREE.LineSegments(edges, edgeMaterial));
  }
  scene.add(mesh);
  if (facadeDataURI) {
    textureLoader.load(facadeDataURI, function (tex) {
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = renderer.capabilities ? renderer.capabilities.getMaxAnisotropy() : 1;
      const facadeMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0.0 });
      mesh.material[0] = facadeMat; // +x
      mesh.material[1] = facadeMat; // -x
      mesh.material[4] = facadeMat; // +z
      mesh.material[5] = facadeMat; // -z
    });
  }
  return mesh;
}

function addSlab(fx, fy, fw, fh, height) {
  const s = toScene(fx, fy, fw, fh);
  const geo = new THREE.BoxGeometry(s.W, height, s.D);
  const mesh = new THREE.Mesh(geo, buildingMaterial);
  mesh.position.set(s.X, height / 2, s.Z);
  mesh.receiveShadow = true;
  const edges = new THREE.EdgesGeometry(geo);
  mesh.add(new THREE.LineSegments(edges, edgeMaterial));
  scene.add(mesh);
}

function addProp(fx, fy, fr, height, baseY) {
  const X = (fx - MAP_W / 2) / SCALE;
  const Z = (fy - MAP_H / 2) / SCALE;
  const R = fr / SCALE;
  const geo = new THREE.CylinderGeometry(R * 0.92, R, height, 24);
  const mesh = new THREE.Mesh(geo, buildingMaterial);
  mesh.position.set(X, baseY + height / 2, Z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

SLABS.forEach(function (s) {
  addSlab(s.x, s.y, s.w, s.h, s.height || 0.08);
});
PROPS.forEach(function (p) {
  addProp(p.x, p.y, p.r || 8, p.height || 0.18, p.baseY || 0);
});

function buildAllFootprints(roofTexture) {
  FOOTPRINTS.forEach(function (f, i) {
    const h = f.height || (0.6 + (i % 5) * 0.18);
    let facadeDataURI = null;
    if (HAS_FACADE && FACADE_MAP[i]) facadeDataURI = FACADE_MAP[i];
    else if (FACADE_MAP_IZQ[i]) facadeDataURI = FACADE_MAP_IZQ[i];
    addBuilding(f.x, f.y, f.w, f.h, h, roofTexture, facadeDataURI);
  });
}


function makeTiledFaceMaterial(baseTexture, worldW, worldH, tileH) {
  const tex = baseTexture.clone();
  tex.image = baseTexture.image;
  tex.needsUpdate = true;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  const aspect = baseTexture.image.width / baseTexture.image.height;
  const tileW = tileH * aspect;
  const repX = Math.max(1, Math.round(worldW / tileW));
  const repY = Math.max(1, Math.round(worldH / tileH));
  tex.repeat.set(repX, repY);
  if (renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.92, metalness: 0.04 });
}

function addPlainWall(fx, fy, fw, fh, height, color, wallTextureURI) {
  const s = toScene(fx, fy, fw, fh);
  const geo = new THREE.BoxGeometry(s.W, height, s.D);
  const plainMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.92, metalness: 0.04 });
  const mesh = new THREE.Mesh(geo, plainMat);
  mesh.position.set(s.X, height / 2, s.Z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  if (!wallTextureURI) {
    const edges = new THREE.EdgesGeometry(geo);
    mesh.add(new THREE.LineSegments(edges, edgeMaterial));
  }
  scene.add(mesh);
  if (wallTextureURI) {
    textureLoader.load(wallTextureURI, function (tex) {
      tex.encoding = THREE.sRGBEncoding;
      const tileH = height;
      const frontMat = makeTiledFaceMaterial(tex, s.W, height, tileH);
      const sideMat = makeTiledFaceMaterial(tex, s.D, height, tileH);
      const topMat = makeTiledFaceMaterial(tex, s.W, s.D, tileH);
      mesh.material = [sideMat, sideMat, topMat, plainMat, frontMat, frontMat];
    });
  }
  return mesh;
}

if (HAS_TEXTURE) {
  const loader = new THREE.TextureLoader();
  loader.load(ROOF_DATA_URI, function (roofTexture) {
    roofTexture.encoding = THREE.sRGBEncoding;
    buildAllFootprints(roofTexture);
  });
} else {
  buildAllFootprints(null);
}

// ============= ACERAS Y FAROLAS =============
// Aceras: plataformas blancas rectangulares a cada lado de los edificios
// (entre la fachada y la calle), con una altura razonable de bordillo.
const SIDEWALK_HEIGHT = 0.14;   // altura del bordillo/acera en unidades de mundo (~14 cm)
const SIDEWALK_DEPTH = 22;      // ancho de la acera, en unidades del mapa fuente
const SIDEWALK_PAD = 40;        // margen extra en Y para que la acera sobresalga un poco en los extremos

const halfMap = MAP_W / 2;
const LEFT_ROW = FOOTPRINTS.filter(function (f) { return f.x < halfMap; });
const RIGHT_ROW = FOOTPRINTS.filter(function (f) { return f.x >= halfMap; });

// borde interior (pegado a fachada) de cada acera, calculado para no invadir ningun edificio
const leftFacadeEdge = Math.max.apply(null, LEFT_ROW.map(function (f) { return f.x + f.w; }));
const rightFacadeEdge = Math.min.apply(null, RIGHT_ROW.map(function (f) { return f.x; }));

const allYStart = Math.min.apply(null, FOOTPRINTS.map(function (f) { return f.y; })) - SIDEWALK_PAD;
const allYEnd = Math.max.apply(null, FOOTPRINTS.map(function (f) { return f.y + f.h; })) + SIDEWALK_PAD;
const sidewalkFy = allYStart;
const sidewalkFh = allYEnd - allYStart;

const sidewalkMaterial = new THREE.MeshStandardMaterial({ color: 0xf2f1ec, roughness: 0.9, metalness: 0.0 });

const SIDEWALK_TEXTURE_DATA_URI = "img/acera.jpg";
const SIDEWALK_TILE_SIZE = 2.4; // tamano (en unidades de mundo) de una baldosa repetida de la textura

function tileSidewalkFaceMaterial(baseTexture, dimA, dimB) {
  const tex = baseTexture.clone();
  tex.image = baseTexture.image;
  tex.needsUpdate = true;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1, Math.round(dimA / SIDEWALK_TILE_SIZE)), Math.max(1, Math.round(dimB / SIDEWALK_TILE_SIZE)));
  if (renderer.capabilities) tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, metalness: 0.0 });
}

function addSidewalk(fx, fy, fw, fh, height) {
  const s = toScene(fx, fy, fw, fh);
  const geo = new THREE.BoxGeometry(s.W, height, s.D);
  const mesh = new THREE.Mesh(geo, sidewalkMaterial);
  mesh.position.set(s.X, height / 2, s.Z);
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  const edges = new THREE.EdgesGeometry(geo);
  mesh.add(new THREE.LineSegments(edges, edgeMaterial));
  scene.add(mesh);
  textureLoader.load(SIDEWALK_TEXTURE_DATA_URI, function (tex) {
    tex.encoding = THREE.sRGBEncoding;
    const sideXMat = tileSidewalkFaceMaterial(tex, s.D, height); // caras +x/-x (laterales cortos): ancho = profundidad D
    const sideZMat = tileSidewalkFaceMaterial(tex, s.W, height); // caras +z/-z (laterales largos): ancho = anchura W
    const topMat = tileSidewalkFaceMaterial(tex, s.W, s.D);      // cara superior
    mesh.material = [sideXMat, sideXMat, topMat, sidewalkMaterial, sideZMat, sideZMat];
  });
  return { fxStart: fx, fxEnd: fx + fw };
}

// acera izquierda: cubre TODA la superficie bajo la fila de edificios de la izquierda,
// desde el borde exterior del mapa hasta el borde de la calle central (mismo borde de
// calle que antes, para que las farolas no cambien de posicion)
const leftOuterEdge = Math.min.apply(null, LEFT_ROW.map(function (f) { return f.x; }));
const leftSidewalk = addSidewalk(leftOuterEdge, sidewalkFy, (leftFacadeEdge + SIDEWALK_DEPTH) - leftOuterEdge, sidewalkFh, SIDEWALK_HEIGHT);
// acera derecha: cubre TODA la superficie bajo la fila de edificios de la derecha,
// desde el borde de la calle central hasta el borde exterior del mapa
const rightOuterEdge = Math.max.apply(null, RIGHT_ROW.map(function (f) { return f.x + f.w; }));
const rightSidewalkFx = rightFacadeEdge - SIDEWALK_DEPTH;
const rightSidewalk = addSidewalk(rightSidewalkFx, sidewalkFy, rightOuterEdge - rightSidewalkFx, sidewalkFh, SIDEWALK_HEIGHT);

// Farolas (streetlamps) - sprites con textura personalizada, apoyadas sobre la acera,
// alineadas a lo largo de la calle en el borde exterior de cada acera (junto al bordillo)
const LAMP_TEXTURE_URI = "img/farola.png";
let LAMP_TEXTURE = null;
const lampSprites = [];

// una farola por edificio, situada en la CALLE (no en la acera), justo pasando el
// bordillo hacia el centro de la calle, a la altura Y del centro de ese edificio.
// Se mantiene la misma alineacion a lo largo de la calle que antes (misma Z),
// pero la X se desplaza desde el borde de la acera hacia el interior de la calle,
// y la base se apoya en el nivel del suelo (calle), no en la altura de la acera.
const LAMP_STREET_OFFSET = 10; // desplazamiento hacia la calle, en unidades del mapa fuente
const LAMP_BASE_Y = 0; // la farola se apoya en el nivel de la calle (suelo), no en SIDEWALK_HEIGHT
const LAMP_POSITIONS = FOOTPRINTS.map(function (f) {
  const isLeftRow = f.x < halfMap;
  const fy = f.y + f.h / 2;
  const fx = isLeftRow
    ? leftSidewalk.fxEnd + LAMP_STREET_OFFSET
    : rightSidewalk.fxStart - LAMP_STREET_OFFSET;
  const X = (fx - halfMap) / SCALE;
  const Z = (fy - MAP_H / 2) / SCALE;
  return { X: X, Z: Z };
});

textureLoader.load(LAMP_TEXTURE_URI, function (tex) {
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = renderer.capabilities ? renderer.capabilities.getMaxAnisotropy() : 1;
  LAMP_TEXTURE = tex;
  const aspect = tex.image.width / tex.image.height; // ancho/alto de la imagen de la farola
  const lampWorldHeight = 3.1; // altura de la farola en unidades de mundo
  const lampWorldWidth = lampWorldHeight * aspect;

  LAMP_POSITIONS.forEach(function (p) {
    const mat = new THREE.SpriteMaterial({
      map: tex,
      transparent: true,
      depthWrite: false
    });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(lampWorldWidth, lampWorldHeight, 1);
    // el sprite se centra en su punto medio; lo subimos media altura
    // para que la base de la farola quede apoyada sobre la calle
    sprite.position.set(p.X, LAMP_BASE_Y + lampWorldHeight / 2, p.Z);
    scene.add(sprite);
    lampSprites.push(sprite);
  });
});
// ============= FIN ACERAS Y FAROLAS =============

// ============= CARTEL 3D COLGADO EN LA PARED (bandera, mira hacia afuera) =============
const SIGN_TEXTURE_DATA_URI = "img/cartel1_otoman_vision.jpg";
const SIGN_BUILDING_INDEX = 2; // edificio 3, fila izquierda (contando desde 1)
const signBuilding = FOOTPRINTS[SIGN_BUILDING_INDEX];
const signFaceX_source = signBuilding.x + signBuilding.w; // borde de la fachada (hacia la calle)
const signFaceX = (signFaceX_source - halfMap) / SCALE;

const signCenterZ = (signCenterZ_source - MAP_H / 2) / SCALE;
const SIGN_Z_OFFSET = 0.32; // desplazamiento lateral respecto al centro de fachada (junto a la puerta, no encima)
const SIGN_ASPECT = 535 / 514; // ancho/alto de la imagen del cartel recortada

// El cartel es una "bandera": su cara (con el diseno) NO mira hacia afuera de la pared (+X),
// sino a lo largo de la calle (+/-Z), como un cartel de tienda que sobresale en un soporte
// perpendicular a la fachada, para que se lea al caminar por la acera y se vea de canto
// al mirar la pared de frente -- igual que en la imagen de referencia.
const SIGN_HEIGHT_WORLD = 0.34; // mas pequeno, como se pidio
const SIGN_WIDTH_X_WORLD = SIGN_HEIGHT_WORLD * SIGN_ASPECT; // cuanto sobresale de la pared
const SIGN_DEPTH_Z_WORLD = 0.045; // grosor del cartel (canto)
const SIGN_MOUNT_Y = 1.55; // altura de montaje, junto al dintel de la puerta
const SIGN_ARM_LENGTH = 0.1; // longitud del brazo/mensula que une el cartel a la pared

const signFrameMaterial = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.6, metalness: 0.2 });
// dimensiones del box: X = lo que sobresale de la pared, Y = altura, Z = grosor (canto, delgado)
const signGeo = new THREE.BoxGeometry(SIGN_WIDTH_X_WORLD, SIGN_HEIGHT_WORLD, SIGN_DEPTH_Z_WORLD);
const signMesh = new THREE.Mesh(signGeo, [signFrameMaterial, signFrameMaterial, signFrameMaterial, signFrameMaterial, signFrameMaterial, signFrameMaterial]);
const signCenterX = signFaceX + SIGN_ARM_LENGTH + SIGN_WIDTH_X_WORLD / 2;
signMesh.position.set(signCenterX, SIGN_MOUNT_Y, signCenterZ + SIGN_Z_OFFSET);
signMesh.castShadow = true;
signMesh.receiveShadow = true;
scene.add(signMesh);
const signEdges = new THREE.EdgesGeometry(signGeo);
signMesh.add(new THREE.LineSegments(signEdges, edgeMaterial));

// mensula (soporte) que une el cartel a la pared: un brazo horizontal + una placa vertical en la pared
const bracketMat = new THREE.MeshStandardMaterial({ color: 0x141414, roughness: 0.5, metalness: 0.3 });
const armGeo = new THREE.BoxGeometry(SIGN_ARM_LENGTH + 0.02, 0.035, 0.035);
const armMesh = new THREE.Mesh(armGeo, bracketMat);
armMesh.position.set(signFaceX + SIGN_ARM_LENGTH / 2, SIGN_MOUNT_Y, signCenterZ + SIGN_Z_OFFSET);
scene.add(armMesh);
const plateGeo = new THREE.BoxGeometry(0.02, 0.16, 0.1);
const plateMesh = new THREE.Mesh(plateGeo, bracketMat);
plateMesh.position.set(signFaceX + 0.01, SIGN_MOUNT_Y, signCenterZ + SIGN_Z_OFFSET);
scene.add(plateMesh);

const signFaceMaterial2 = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.05 });
signMesh.material[4] = signFaceMaterial2;
signMesh.material[5] = signFaceMaterial2;
signMesh.material.needsUpdate = true;
textureLoader.load(SIGN_TEXTURE_DATA_URI, function (tex) {
  tex.encoding = THREE.sRGBEncoding;
  signFaceMaterial2.map = tex;
  signFaceMaterial2.needsUpdate = true;
});

// ---- Iluminacion interior + exterior calida, y resaltado al pasar el cursor (cartel OTOMAN VISION, edificio 3) ----
const SIGN1_EMISSIVE_DATA_URI = "img/cartel1_otoman_vision_luz.jpg";
signFaceMaterial2.emissive = new THREE.Color(0xffffff);
signFaceMaterial2.emissiveIntensity = 0;

const sign1GlowLight = new THREE.PointLight(0xffb35c, 0, 2.2);
sign1GlowLight.position.set(signCenterX, SIGN_MOUNT_Y, signCenterZ + SIGN_Z_OFFSET);
scene.add(sign1GlowLight);

let sign1Lit = false;
function setSign1Lit(lit) {
  sign1Lit = lit;
  signFaceMaterial2.emissiveIntensity = lit ? 1.5 : 0;
  sign1GlowLight.intensity = lit ? 1.6 : 0;
}

const sign1HoverOutlineMat = new THREE.LineBasicMaterial({ color: 0xffe27a, linewidth: 2, transparent: true, opacity: 0.95 });
const sign1HoverOutline = new THREE.LineSegments(new THREE.EdgesGeometry(signGeo), sign1HoverOutlineMat);
sign1HoverOutline.position.copy(signMesh.position);
sign1HoverOutline.visible = false;
scene.add(sign1HoverOutline);

const sign1Raycaster = new THREE.Raycaster();
const sign1Pointer = new THREE.Vector2();
let sign1Hovering = false;
let sign1PointerDownPos = null;

wrap.addEventListener('pointerdown', function (e) {
  sign1PointerDownPos = { x: e.clientX, y: e.clientY };
});
wrap.addEventListener('pointerup', function (e) {
  if (!sign1PointerDownPos) return;
  const dx = e.clientX - sign1PointerDownPos.x;
  const dy = e.clientY - sign1PointerDownPos.y;
  sign1PointerDownPos = null;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return; // fue un arrastre de camara, no un clic
  const rect = wrap.getBoundingClientRect();
  sign1Pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  sign1Pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  sign1Raycaster.setFromCamera(sign1Pointer, camera);
  const hits = sign1Raycaster.intersectObject(signMesh, false);
  if (hits.length > 0) {
    setSign1Lit(!sign1Lit);
  }
});

window.addEventListener('pointermove', function (e) {
  const rect = wrap.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
    if (sign1Hovering) { sign1Hovering = false; sign1HoverOutline.visible = false; }
    return;
  }
  sign1Pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  sign1Pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  sign1Raycaster.setFromCamera(sign1Pointer, camera);
  const hits = sign1Raycaster.intersectObject(signMesh, false);
  const isHover = hits.length > 0;
  if (isHover !== sign1Hovering) {
    sign1Hovering = isHover;
    sign1HoverOutline.visible = isHover;
    wrap.style.cursor = isHover ? 'pointer' : 'default';
  }
});

const marqGlowLights = [];
function makeMarqGlow(x, y, z, intensity, distance) {
  const lt = new THREE.PointLight(0xffb35c, 0, distance);
  lt.position.set(x, y, z);
  scene.add(lt);
  marqGlowLights.push({ light: lt, targetIntensity: intensity });
  return lt;
}

let marqueeLit = false;
const MARQ_EMISSIVE_ON = 1.6;

function setMarqueeLit(lit) {
  marqueeLit = lit;
  const target = lit ? MARQ_EMISSIVE_ON : 0;
  marqFrontMaterial.emissiveIntensity = target;
  marqNameMaterial.emissiveIntensity = target;
  marqSideMaterial.emissiveIntensity = target;
  marqGlowLights.forEach(function (g) { g.light.intensity = lit ? g.targetIntensity : 0; });
}

const marqRaycaster = new THREE.Raycaster();
const marqPointer = new THREE.Vector2();
let marqPointerDownPos = null;
wrap.addEventListener('pointerdown', function (e) {
  marqPointerDownPos = { x: e.clientX, y: e.clientY };
});
wrap.addEventListener('pointerup', function (e) {
  if (!marqPointerDownPos) return;
  const dx = e.clientX - marqPointerDownPos.x;
  const dy = e.clientY - marqPointerDownPos.y;
  marqPointerDownPos = null;
  if (Math.sqrt(dx * dx + dy * dy) > 8) return; // fue un arrastre de camara, no un clic
  const rect = wrap.getBoundingClientRect();
  marqPointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  marqPointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  marqRaycaster.setFromCamera(marqPointer, camera);
  const hits = marqRaycaster.intersectObjects([marqBoxMesh, marqNameMesh], false);
  if (hits.length > 0) {
    setMarqueeLit(!marqueeLit);
  }
});

const marqHoverOutlineMat = new THREE.LineBasicMaterial({ color: 0xffe27a, linewidth: 2, transparent: true, opacity: 0.95 });
const marqBoxHoverOutline = new THREE.LineSegments(new THREE.EdgesGeometry(marqBoxGeo), marqHoverOutlineMat);
marqBoxHoverOutline.position.copy(marqBoxMesh.position);
marqBoxHoverOutline.visible = false;
scene.add(marqBoxHoverOutline);
const marqNameHoverOutline = new THREE.LineSegments(new THREE.EdgesGeometry(marqNameGeo), marqHoverOutlineMat);
marqNameHoverOutline.position.copy(marqNameMesh.position);
marqNameHoverOutline.visible = false;
scene.add(marqNameHoverOutline);

let marqHovering = false;
window.addEventListener('pointermove', function (e) {
  const rect = wrap.getBoundingClientRect();
  if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
    if (marqHovering) { marqHovering = false; marqBoxHoverOutline.visible = false; marqNameHoverOutline.visible = false; wrap.style.cursor = 'default'; }
    return;
  }
  marqPointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  marqPointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  marqRaycaster.setFromCamera(marqPointer, camera);
  const hits = marqRaycaster.intersectObjects([marqBoxMesh, marqNameMesh], false);
  const isHover = hits.length > 0;
  if (isHover !== marqHovering) {
    marqHovering = isHover;
    marqBoxHoverOutline.visible = isHover;
    marqNameHoverOutline.visible = isHover;
    wrap.style.cursor = isHover ? 'pointer' : 'default';
  }
});

const roof13CenterZ = (roof13Building.y + roof13Building.h / 2 - MAP_H / 2) / SCALE;
const ROOF13_THICKNESS = 0.02;
const roof13CenterY = roof13Building.height + ROOF13_THICKNESS / 2 + 0.003; // justo encima del techo, sin z-fighting

const roof13SideMat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.85, metalness: 0.05 });
const roof13TopMat = new THREE.MeshStandardMaterial({ color: 0x4a3524, roughness: 0.85, metalness: 0.05 });
const roof13Geo = new THREE.BoxGeometry(roof13WidthX, ROOF13_THICKNESS, roof13WidthZ);
const roof13Mesh = new THREE.Mesh(roof13Geo, [roof13SideMat, roof13SideMat, roof13TopMat, roof13SideMat, roof13SideMat, roof13SideMat]);
roof13Mesh.position.set(roof13CenterX, roof13CenterY, roof13CenterZ);
roof13Mesh.castShadow = true;
roof13Mesh.receiveShadow = true;

textureLoader.load(ROOF13_TEXTURE_DATA_URI, function (tex) {

  tex.wrapS = THREE.RepeatWrapping;

});
// ============= FIN TEXTURA DE TECHO (edificio 13) =============

// ============= SEÑALIZACION FLOTANTE DE PUNTOS DE INTERES =============
// Iconos flotantes sobre cada cartel y la marquesina, para indicar al usuario
// que son elementos interactivos con los que puede pararse a interactuar.
function makePointOfInterestTexture() {
  const size = 128;
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const cx = size / 2, cy = size / 2;

  // halo suave
  const grad = ctx.createRadialGradient(cx, cy, size * 0.1, cx, cy, size * 0.5);
  grad.addColorStop(0, 'rgba(255, 200, 90, 0.55)');
  grad.addColorStop(1, 'rgba(255, 200, 90, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // circulo principal
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.30, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(24, 18, 12, 0.92)';
  ctx.fill();
  ctx.lineWidth = size * 0.045;
  ctx.strokeStyle = '#ffce6b';
  ctx.stroke();

  // signo "i" de interaccion
  ctx.fillStyle = '#ffce6b';
  ctx.beginPath();
  ctx.arc(cx, cy - size * 0.115, size * 0.045, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(cx - size * 0.035, cy - size * 0.03, size * 0.07, size * 0.20);

  const tex = new THREE.CanvasTexture(canvas);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

const poiTexture = makePointOfInterestTexture();
const poiMaterialTemplate = { map: poiTexture, transparent: true, depthWrite: false, sizeAttenuation: true };
const pointsOfInterest = [];

function addPointOfInterest(targetMesh, topY, options) {
  options = options || {};
  const mat = new THREE.SpriteMaterial(Object.assign({}, poiMaterialTemplate));
  const sprite = new THREE.Sprite(mat);
  const scale = options.scale || 0.22;
  sprite.scale.set(scale, scale, scale);
  sprite.position.set(targetMesh.position.x, topY + 0.16, targetMesh.position.z);
  scene.add(sprite);
  pointsOfInterest.push({
    sprite: sprite,
    baseY: topY + 0.16,
    phase: Math.random() * Math.PI * 2,
    litRef: options.litRef || null
  });
  return sprite;
}

// Un punto de interes sobre cada cartel y sobre la marquesina
addPointOfInterest(signMesh, SIGN_MOUNT_Y + SIGN_HEIGHT_WORLD / 2, { litRef: () => sign1Lit });
addPointOfInterest(sign2Mesh, SIGN2_MOUNT_Y + SIGN2_HEIGHT_WORLD / 2, { litRef: () => sign2Lit });
addPointOfInterest(sign4Mesh, SIGN4_MOUNT_Y + SIGN4_HEIGHT_WORLD / 2, { scale: 0.28, litRef: () => sign4Lit });
addPointOfInterest(sign5Mesh, SIGN5_MOUNT_Y + SIGN5_HEIGHT_WORLD / 2, { litRef: () => sign5Lit });
addPointOfInterest(sign6Mesh, SIGN6_MOUNT_Y + SIGN6_HEIGHT_WORLD / 2, { litRef: () => sign6Lit });
addPointOfInterest(marqBoxMesh, marqNameCenterY + MARQ_NAME_HEIGHT / 2 + 0.55, { scale: 0.32, litRef: () => marqueeLit });

function updatePointsOfInterest(elapsed) {
  for (let i = 0; i < pointsOfInterest.length; i++) {
    const poi = pointsOfInterest[i];
    const bob = Math.sin(elapsed * 1.6 + poi.phase) * 0.05;
    poi.sprite.position.y = poi.baseY + bob;
    const pulse = 0.85 + Math.sin(elapsed * 2.2 + poi.phase) * 0.15;
    const isLit = poi.litRef ? poi.litRef() : false;
    poi.sprite.material.opacity = isLit ? 0.35 : pulse;
  }
}
// ============= FIN SEÑALIZACION FLOTANTE =============










// Muro al fondo de la calle (paseo maritimo), con textura de piedra en frontal, superior y laterales
const WALL_TEXTURE_URI = "img/muro_fondo.jpg";
addPlainWall(0, -136, MAP_W, 32, 0.5, 0x9a9a98, WALL_TEXTURE_URI);

// Mar 3D al fondo con volumen: bloque de agua con altura similar al muro,
// superficie superior animada y frontal texturizado
let updateSea = function () {};
(function () {
  const fx = -1600, fy = -12136, fw = MAP_W + 3200, fh = 12000;
  const s = toScene(fx, fy, fw, fh);
  const seaHeight = 0.5;
  const segX = 220, segZ = 180;

  const bodyGeo = new THREE.BoxGeometry(s.W, seaHeight, s.D);
  const sideMat = new THREE.MeshStandardMaterial({
    color: 0x7fa5b8,
    roughness: 0.42,
    metalness: 0.02
  });
  const topBodyMat = new THREE.MeshStandardMaterial({
    color: 0x86abc0,
    roughness: 0.30,
    metalness: 0.03
  });
  const bottomMat = new THREE.MeshStandardMaterial({
    color: 0x678393,
    roughness: 0.85,
    metalness: 0
  });
  const frontBodyMat = new THREE.MeshStandardMaterial({
    color: 0x82a9bc,
    roughness: 0.30,
    metalness: 0.03
  });
  const body = new THREE.Mesh(bodyGeo, [sideMat, sideMat, topBodyMat, bottomMat, frontBodyMat, frontBodyMat]);
  body.position.set(s.X, seaHeight / 2, s.Z);
  body.receiveShadow = true;
  scene.add(body);

  const topGeo = new THREE.PlaneGeometry(s.W, s.D, segX, segZ);
  topGeo.rotateX(-Math.PI / 2);
  const topPos = topGeo.attributes.position;
  const topBase = topPos.array.slice();
  const topMat = new THREE.MeshStandardMaterial({
    color: 0x86abc0,
    roughness: 0.20,
    metalness: 0.04
  });
  const topMesh = new THREE.Mesh(topGeo, topMat);
  topMesh.position.set(s.X, seaHeight + 0.015, s.Z);
  topMesh.receiveShadow = true;
  scene.add(topMesh);

  const frontGeo = new THREE.PlaneGeometry(s.W, seaHeight, 140, 24);
  const frontPos = frontGeo.attributes.position;
  const frontBase = frontPos.array.slice();
  const frontMat = new THREE.MeshStandardMaterial({
    color: 0x82a9bc,
    roughness: 0.26,
    metalness: 0.03,
    side: THREE.DoubleSide
  });
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  frontMesh.position.set(s.X, seaHeight / 2, s.Z + s.D / 2 + 0.01);
  frontMesh.receiveShadow = true;
  scene.add(frontMesh);

  const hazeGeo = new THREE.PlaneGeometry(s.W * 1.15, 48);
  const hazeMat = new THREE.MeshBasicMaterial({
    color: 0xb9d2e0,
    transparent: true,
    opacity: 0.24,
    depthWrite: false
  });
  const haze = new THREE.Mesh(hazeGeo, hazeMat);
  haze.position.set(s.X, 22, s.Z - s.D / 2 + 18);
  scene.add(haze);

  const waveSpeedA = 1.22;
  const waveSpeedB = 0.88;
  const waveSpeedC = 0.62;

  function animateSeaTop(time) {
    const arr = topPos.array;
    for (let i = 0; i < arr.length; i += 3) {
      const x = topBase[i];
      const z = topBase[i + 2];
      const wave =
        Math.sin(x * 0.020 + time * waveSpeedA) * 0.22 +
        Math.cos(z * 0.016 - time * waveSpeedB) * 0.16 +
        Math.sin((x + z) * 0.011 + time * waveSpeedC) * 0.10;
      arr[i + 1] = wave;
    }
    topPos.needsUpdate = true;
    topGeo.computeVertexNormals();
  }

  function animateSeaFront(time) {
    const arr = frontPos.array;
    for (let i = 0; i < arr.length; i += 3) {
      const x = frontBase[i];
      const y = frontBase[i + 1];
      const ripple =
        Math.sin(x * 0.030 + time * 1.18) * 0.10 +
        Math.cos((x + y) * 0.050 - time * 0.92) * 0.05;
      arr[i + 2] = ripple;
    }
    frontPos.needsUpdate = true;
    frontGeo.computeVertexNormals();
  }

  updateSea = function (time) {
    animateSeaTop(time);
    animateSeaFront(time);
  };

  function drawWrappedSeaImage(ctx, img, offsetX, offsetY, size) {
    const ox = ((offsetX % size) + size) % size;
    const oy = ((offsetY % size) + size) % size;
    ctx.drawImage(img, -ox, -oy, size, size);
    ctx.drawImage(img, size - ox, -oy, size, size);
    ctx.drawImage(img, -ox, size - oy, size, size);
    ctx.drawImage(img, size - ox, size - oy, size, size);
  }

  function buildUniformSeaTexture(sourceImage) {
    const size = 1024;

    const baseCanvas = document.createElement('canvas');
    baseCanvas.width = baseCanvas.height = size;
    const baseCtx = baseCanvas.getContext('2d');
    baseCtx.filter = 'blur(2.4px) saturate(0.92)';
    drawWrappedSeaImage(baseCtx, sourceImage, 0, 0, size);
    baseCtx.filter = 'none';

    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(baseCanvas, 0, 0);

    ctx.globalAlpha = 0.16;
    drawWrappedSeaImage(ctx, baseCanvas, Math.round(size * 0.37), Math.round(size * 0.18), size);
    ctx.globalAlpha = 0.12;
    drawWrappedSeaImage(ctx, baseCanvas, Math.round(size * 0.58), Math.round(size * 0.52), size);
    ctx.globalAlpha = 1;

    const seamBand = Math.round(size * 0.14);
    for (let i = 0; i < seamBand; i++) {
      const blend = 0.55 * (1 - i / Math.max(1, seamBand - 1));
      ctx.globalAlpha = blend;
      ctx.drawImage(baseCanvas, 0, size - seamBand + i, size, 1, 0, i, size, 1);
      ctx.drawImage(baseCanvas, 0, i, size, 1, 0, size - seamBand + i, size, 1);
    }
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = '#8fb2c4';
    ctx.fillRect(0, 0, size, size);
    ctx.globalAlpha = 1;

    const seaTexture = new THREE.CanvasTexture(canvas);
    seaTexture.encoding = THREE.sRGBEncoding;
    seaTexture.wrapS = THREE.MirroredRepeatWrapping;
    seaTexture.wrapT = THREE.MirroredRepeatWrapping;
    if (renderer.capabilities && renderer.capabilities.getMaxAnisotropy) {
      seaTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    }
    return seaTexture;
  }

  const SEA_TEXTURE_URI = "img/mar.jpg";

  textureLoader.load(SEA_TEXTURE_URI, function (tex) {
    const topTex = buildUniformSeaTexture(tex.image);
    topTex.repeat.set(Math.max(14, Math.round(s.W / 48)), Math.max(24, Math.round(s.D / 34)));
    topTex.offset.set(0, 0);

    const frontTex = buildUniformSeaTexture(tex.image);
    frontTex.repeat.set(Math.max(14, Math.round(s.W / 48)), 1.35);
    frontTex.offset.set(0, 0);

    topMat.map = topTex;
    topMat.needsUpdate = true;
    topBodyMat.map = topTex;
    topBodyMat.needsUpdate = true;

    frontMat.map = frontTex;
    frontMat.needsUpdate = true;
    frontBodyMat.map = frontTex;
    frontBodyMat.needsUpdate = true;

    tex.dispose();

    updateSea = function (time) {
      topTex.offset.x = (time * 0.0028) % 1;
      topTex.offset.y = (time * 0.0085) % 1;
      frontTex.offset.x = (time * 0.0032) % 1;
      frontTex.offset.y = (time * 0.0048) % 1;
      animateSeaTop(time);
      animateSeaFront(time);
    };
  });
})();;

let yaw = 0, pitch = 0, targetYaw = 0, targetPitch = 0;
let dragging = false, originX = 0, originY = 0, moveX = 0, moveY = 0;
const maxR = 45;

function showJoy(x, y) {
  joyBase.style.left = x + 'px'; joyBase.style.top = y + 'px'; joyBase.style.display = 'block';
  joyDot.style.left = x + 'px'; joyDot.style.top = y + 'px'; joyDot.style.display = 'block';
}
function hideJoy() {
  joyBase.style.display = 'none'; joyDot.style.display = 'none';
  moveX = 0; moveY = 0;
}

wrap.addEventListener('pointerdown', function (e) {
  dragging = true;
  originX = e.clientX; originY = e.clientY;
  showJoy(originX, originY);
  wrap.setPointerCapture(e.pointerId);
});
window.addEventListener('pointermove', function (e) {
  if (!dragging) {
    const nx = (e.clientX / window.innerWidth) * 2 - 1;
    const ny = (e.clientY / window.innerHeight) * 2 - 1;
    targetYaw = -nx * 0.9;
    targetPitch = Math.max(-0.4, Math.min(0.4, -ny * 0.4));
    return;
  }
  let dx = e.clientX - originX, dy = e.clientY - originY;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; }
  joyDot.style.left = (originX + dx) + 'px';
  joyDot.style.top = (originY + dy) + 'px';
  moveX = dx / maxR;
  moveY = -dy / maxR;
});
window.addEventListener('pointerup', function () {
  dragging = false;
  hideJoy();
});

// Flechas del teclado: desplazamiento rapido (adelante/atras/izquierda/derecha)
const keyMoveState = { forward: false, backward: false, left: false, right: false };
window.addEventListener('keydown', function (e) {
  switch (e.key) {
    case 'ArrowUp': keyMoveState.forward = true; e.preventDefault(); break;
    case 'ArrowDown': keyMoveState.backward = true; e.preventDefault(); break;
    case 'ArrowLeft': keyMoveState.left = true; e.preventDefault(); break;
    case 'ArrowRight': keyMoveState.right = true; e.preventDefault(); break;
  }
});
window.addEventListener('keyup', function (e) {
  switch (e.key) {
    case 'ArrowUp': keyMoveState.forward = false; break;
    case 'ArrowDown': keyMoveState.backward = false; break;
    case 'ArrowLeft': keyMoveState.left = false; break;
    case 'ArrowRight': keyMoveState.right = false; break;
  }
});

function onResize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
const boundExtent = groundSize / 2 - 2;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const elapsed = clock.elapsedTime;

  updateSea(elapsed);
  updatePointsOfInterest(elapsed);

  yaw += (targetYaw - yaw) * 0.08;
  pitch += (targetPitch - pitch) * 0.08;
  camera.rotation.x = pitch;
  camera.rotation.y = yaw;

  // combinar movimiento del joystick/raton con el de las flechas del teclado
  const keyMoveX = (keyMoveState.right ? 1 : 0) - (keyMoveState.left ? 1 : 0);
  const keyMoveY = (keyMoveState.forward ? 1 : 0) - (keyMoveState.backward ? 1 : 0);
  const totalMoveX = Math.max(-1, Math.min(1, moveX + keyMoveX));
  const totalMoveY = Math.max(-1, Math.min(1, moveY + keyMoveY));
  const keyActive = keyMoveX !== 0 || keyMoveY !== 0;

  if (totalMoveX !== 0 || totalMoveY !== 0) {
    const forwardX = -Math.sin(yaw), forwardZ = -Math.cos(yaw);
    const rightX = Math.cos(yaw), rightZ = -Math.sin(yaw);
    // el teclado se mueve mas rapido que el joystick (desplazamiento rapido)
    const speed = (keyActive ? 6.0 : 2.4) * delta;
    camera.position.x += (forwardX * totalMoveY + rightX * totalMoveX) * speed;
    camera.position.z += (forwardZ * totalMoveY + rightZ * totalMoveX) * speed;
    camera.position.x = Math.max(-boundExtent, Math.min(boundExtent, camera.position.x));
    camera.position.z = Math.max(-boundExtent, Math.min(boundExtent, camera.position.z));
  }

  renderer.render(scene, camera);
}
animate();
